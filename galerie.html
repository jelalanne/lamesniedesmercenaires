<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie | La Mesnie Des Mercenaires</title>
  <meta name="description" content="Photos des tournois, campements et animations de La Mesnie Des Mercenaires.">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/commun.js" defer></script>
  <!-- Liste des photos : générée par scripts/deployer.ps1, ne pas modifier à la main -->
  <script src="assets/js/galerie-data.js" defer></script>
  <script src="assets/js/galerie.js" defer></script>
</head>
<body>
  <div id="entete"></div>

  <main id="contenu" class="contenu">
    <h1>Galerie</h1>
    <p class="sous-titre">Quelques images de nos tournois, campements et animations</p>

    <hr class="ornement">

    <!-- Les photos sont ajoutées ici automatiquement (voir le README, section « Photos de la galerie ») -->
    <ul id="galerie" class="galerie" aria-label="Photos de la galerie"></ul>
    <p id="galerie-vide" class="galerie-vide" hidden>Aucune photo pour le moment&nbsp;: revenez bientôt&nbsp;!</p>
    <noscript><p class="galerie-vide">La galerie a besoin de JavaScript pour s'afficher.</p></noscript>

    <dialog id="visionneuse" class="visionneuse" aria-label="Visionneuse de photos">
      <figure>
        <img id="visionneuse-image" alt="">
        <figcaption id="visionneuse-legende"></figcaption>
      </figure>
      <button type="button" class="visionneuse-bouton visionneuse-fermer" data-action="fermer" aria-label="Fermer">&#10005;</button>
      <button type="button" class="visionneuse-bouton visionneuse-precedent" data-action="precedent" aria-label="Photo précédente">&#8249;</button>
      <button type="button" class="visionneuse-bouton visionneuse-suivant" data-action="suivant" aria-label="Photo suivante">&#8250;</button>
    </dialog>
  </main>

  <div id="pied-de-page"></div>
</body>
</html>
