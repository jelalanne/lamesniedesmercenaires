<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | La Mesnie Des Mercenaires</title>
  <meta name="description" content="Contactez La Mesnie Des Mercenaires : demande de prestation, adhésion ou simple question.">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/commun.js" defer></script>
  <script src="assets/js/contact.js" defer></script>
</head>
<body>
  <div id="entete"></div>

  <main id="contenu" class="contenu">
    <h1>Nous contacter</h1>
    <p class="sous-titre">Une question, une demande de prestation, l'envie de nous rejoindre&nbsp;?</p>

    <hr class="ornement">

    <!-- Envoyé par e-mail via Web3Forms (clé à régler dans assets/js/config.js) -->
    <form id="formulaire-contact" class="formulaire carte" action="https://api.web3forms.com/submit" method="POST">
      <!-- Champ piège anti-robots : doit rester vide -->
      <input type="checkbox" name="botcheck" class="champ-piege" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="champ">
        <label for="nom">Votre nom <span class="obligatoire" aria-hidden="true">*</span></label>
        <input id="nom" name="nom" type="text" required maxlength="100" autocomplete="name">
      </div>

      <div class="champ">
        <label for="email">Votre adresse e-mail <span class="obligatoire" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" required maxlength="150" autocomplete="email">
      </div>

      <div class="champ">
        <label for="objet">Objet</label>
        <!-- data-raccourci : valeur utilisable dans un lien, ex. contact.html?objet=prestation -->
        <select id="objet" name="objet">
          <option value="Demande de prestation" data-raccourci="prestation">Demande de prestation</option>
          <option value="Rejoindre l'association" data-raccourci="adhesion">Rejoindre l'association</option>
          <option value="Tournoi" data-raccourci="tournoi">Tournoi</option>
          <option value="Autre demande" data-raccourci="autre" selected>Autre demande</option>
        </select>
      </div>

      <div class="champ">
        <label for="message">Votre message <span class="obligatoire" aria-hidden="true">*</span></label>
        <textarea id="message" name="message" required maxlength="5000"></textarea>
      </div>

      <p class="mention">Les champs marqués d'un * sont obligatoires. Vos informations servent uniquement à vous répondre (voir les <a href="mentions-legales.html">mentions légales</a>).</p>

      <div>
        <button type="submit" class="bouton">Envoyer la missive</button>
      </div>

      <p id="etat-envoi" class="message-etat" role="status" aria-live="polite"></p>
    </form>

    <noscript><p class="centre">Le formulaire a besoin de JavaScript : vous pouvez aussi nous écrire via nos réseaux sociaux.</p></noscript>

    <section class="centre">
      <h2>Nous suivre</h2>
      <p>Retrouvez nos actualités sur nos réseaux&nbsp;:</p>
      <ul class="reseaux" data-reseaux></ul>
    </section>
  </main>

  <div id="pied-de-page"></div>
</body>
</html>
